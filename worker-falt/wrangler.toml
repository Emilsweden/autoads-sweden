name = "autoads-falt"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Skapas med:  npx wrangler d1 create autoads-falt
# Klistra in database_id som kommandot skriver ut.
[[d1_databases]]
binding = "DB"
database_name = "autoads-falt"
database_id = "FYLL_I_DATABASE_ID_HAR"

# Samma worker serverar appen, så den fungerar oberoende av autoads.se.
# Filer som matchar en fil i falt/ serveras direkt; allt annat (/api/*, /halsa)
# går vidare till koden i src/index.js.
[assets]
directory = "../falt"

# Påminnelser skickas av workern själv, inte av någon som har appen öppen.
# Varje minut tittar den efter bokningar som börjar om trettio minuter.
[triggers]
crons = ["* * * * *"]

# Egen domän: lägg till zonen i Cloudflare och avkommentera raderna nedan.
# Appen anropar den adress den själv serveras från, så inget mer behöver ändras.
# [[routes]]
# pattern = "app.villatakrenovering.se"
# custom_domain = true

# Hemligheter sätts separat, inte här:
#   npx wrangler secret put INSTALL_NYCKEL   (används en gång, för första admin)
