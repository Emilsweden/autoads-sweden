# Husnummer — var finns de, och var saknas de?
#
# Mätningen av OpenStreetMap (körning 1, 23 sep): Örebro kommun har 5 539
# adresspunkter, Västerås kommun 24 063. I Rynninge saknade 97 % av villorna
# ett husnummer inom 30 m, i Lillån 67 %. Kvar här är sökningen efter andra
# öppna källor.
#
# Läser bara från öppna källor och skriver resultatet i körningens
# sammanfattning. Ändrar ingenting i databasen eller appen.
#
# Körs av sig själv när den här filen ändras på arbetsgrenen, eller för hand
# under Actions.

name: Husnummer — analys

on:
  workflow_dispatch:
  push:
    branches: [claude/door-knock-sales-app-1oegem]
    paths: [.github/workflows/husnummer-analys.yml]

permissions:
  contents: read

jobs:
  analys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Öppna adresskällor som inte kräver konto
        continue-on-error: true
        shell: bash {0}
        run: |
          set -u
          prova() {   # $1 = namn, $2 = adress
            : > /tmp/svar
            kod=$(curl -sS -o /tmp/svar -w '%{http_code}' --max-time 40 -L -A "villatak-analys/1" "$2" 2>/dev/null)
            echo "- **$1** — HTTP $kod — \`$2\`" >> "$GITHUB_STEP_SUMMARY"
            echo "=== $1 ($kod) $2"; head -c 1500 /tmp/svar 2>/dev/null; echo
          }
          echo -e "\n## Källor\n" >> "$GITHUB_STEP_SUMMARY"
          # Sveriges dataportal: dataset om adresser, t.ex. kommunernas egna.
          prova "Dataportalen — adresser" "https://registrera.oppnadata.se/store/search?type=solr&query=public:true+AND+title:*adress*&limit=40"
          prova "Dataportalen — Örebro" "https://registrera.oppnadata.se/store/search?type=solr&query=public:true+AND+title:*Örebro*&limit=40"
          # Lantmäteriets sida om öppna data: är adresserna öppna, och hur hämtas de?
          prova "Lantmäteriet öppna data" "https://www.lantmateriet.se/sv/geodata/vara-produkter/oppna-data/"
          grep -io '[^<>]\{0,160\}adress[^<>]\{0,160\}' /tmp/svar | head -20 || true
          prova "Lantmäteriet produktlista" "https://www.lantmateriet.se/sv/geodata/vara-produkter/produktlista/"
          grep -io '[^<>]\{0,120\}belägenhetsadress[^<>]\{0,160\}' /tmp/svar | head -20 || true
          prova "Dataportalen — sök 'belägenhetsadress'" "https://registrera.oppnadata.se/store/search?type=solr&query=public:true+AND+belägenhetsadress&limit=40"
          prova "Örebro kommun öppna data" "https://www.orebro.se/oppnadata"
          prova "OpenAddresses källor — Sverige" "https://api.github.com/repos/openaddresses/openaddresses/contents/sources/se"
          # OpenAddresses: finns Sverige?
          prova "OpenAddresses — Sverige" "https://batch.openaddresses.io/api/data?source=se"
          # Overture Maps: adresstemat och vilka länder det täcker.
          prova "Overture — adresser" "https://docs.overturemaps.org/guides/addresses/"
          grep -io '[^<>]\{0,100\}\(Sweden\|SE\b\)[^<>]\{0,100\}' /tmp/svar | head -10 || true
